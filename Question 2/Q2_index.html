
<!DOCTYPE html>
<html>
<head>
    <title>Smart Number Validator</title>
</head>
<body>

    <h2>Smart Number Validator</h2>

    <label for="userInput">Enter a number:</label>

    <input type="text" id="userInput"
           placeholder="Enter a number">

    <button id="checkBtn" type="button">Check</button>

    <p id="result" role="status" aria-live="polite"></p>

    <script>
        // Select HTML elements
        const userInput = document.getElementById("userInput");
        const checkBtn = document.getElementById("checkBtn");
        const result = document.getElementById("result");

        // Function to check input
        function checkInput() {

            // Get input value and remove spaces
            const value = userInput.value.trim();

            // Check empty input
            if (value === "") {
                result.textContent = "Please enter a valid number!";
            }

            else {
                // Convert input into a number
                const number = Number(value);

                // Check whether input is a valid number
                if (Number.isNaN(number)) {
                    result.textContent = "Please enter a valid number!";
                }

                else if (number < 10) {
                    result.textContent = "The number is lower than 10";
                }

                else if (number > 10) {
                    result.textContent = "The number is higher than 10";
                }

                else {
                    result.textContent = "The number is equal to 10";
                }
            }
        }

        // Add click event listener
        checkBtn.addEventListener("click", checkInput);

    </script>

</body>
</html>
